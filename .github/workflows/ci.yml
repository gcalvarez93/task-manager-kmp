# Path: .github/workflows/ci.yml
name: CI

on:
  push:
    branches: [main]
  pull_request:

# Una ejecución nueva sobre la misma rama cancela la anterior.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android:
    name: Android and shared logic
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      # El runner ya trae el SDK. Esta acción solo se usa para aceptar las licencias, para que
      # AGP pueda descargar la plataforma que falte. `packages: ''` evita instalar el paquete
      # obsoleto "tools", que es el que hacía fallar este paso.
      - name: Accept Android SDK licenses
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Set up Gradle (with cache)
        uses: gradle/actions/setup-gradle@v6

      - name: Shared logic tests
        run: ./gradlew :sharedLogic:allTests --stacktrace

      - name: Android unit tests
        run: ./gradlew :androidApp:testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: ./gradlew :androidApp:assembleDebug --stacktrace

      # Cuenta los tests ejecutados a partir de los informes JUnit y los muestra en el resumen
      # del job, para comprobar que se han ejecutado de verdad y no solo que el paso termine en verde.
      - name: Test summary
        if: always()
        shell: bash
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import glob, os
          import xml.etree.ElementTree as ET
          rows = {}
          for path in glob.glob("**/build/test-results/**/*.xml", recursive=True):
              module = path.split("/build/")[0]
              suite = ET.parse(path).getroot()
              total, failed, skipped = rows.get(module, (0, 0, 0))
              rows[module] = (
                  total + int(suite.get("tests", 0)),
                  failed + int(suite.get("failures", 0)) + int(suite.get("errors", 0)),
                  skipped + int(suite.get("skipped", 0)),
              )
          print("### Tests ejecutados\n")
          print("| Módulo | Tests | Fallos | Omitidos |")
          print("|---|---|---|---|")
          for module, (total, failed, skipped) in sorted(rows.items()):
              print(f"| {module} | {total} | {failed} | {skipped} |")
          print(f"\n**Total: {sum(r[0] for r in rows.values())}**")
          PY

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: test-reports
          path: |
            **/build/reports/tests/
            **/build/test-results/
          if-no-files-found: ignore

  # Comprueba que la build de release compila con R8 (minificación y ofuscación) sin cambiar
  # nada en el repo: `isMinifyEnabled` sigue en false en build.gradle.kts.
  android-release-r8:
    name: Release build with R8 (check)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Accept Android SDK licenses
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Set up Gradle (with cache)
        uses: gradle/actions/setup-gradle@v6

      # Script de inicialización solo para esta ejecución: activa R8 en la build de release
      # después de evaluar el build.gradle.kts de la app.
      - name: Enable R8 for this run only
        run: |
          cat > "$RUNNER_TEMP/enable-r8.init.gradle" <<'INIT'
          allprojects {
              afterEvaluate { project ->
                  if (project.plugins.hasPlugin('com.android.application')) {
                      project.android.buildTypes.release.minifyEnabled = true
                  }
              }
          }
          INIT

      - name: Assemble release with R8
        run: ./gradlew :androidApp:assembleRelease -I "$RUNNER_TEMP/enable-r8.init.gradle" --stacktrace

      # Si R8 no se ha ejecutado, no existe mapping.txt: así un verde no puede ser falso.
      - name: Check that R8 actually ran
        run: |
          MAPPING=androidApp/build/outputs/mapping/release/mapping.txt
          test -f "$MAPPING" || { echo "R8 did not run: $MAPPING not found"; exit 1; }
          echo "R8 ran. mapping.txt: $(wc -l < "$MAPPING") lines" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload R8 mapping
        uses: actions/upload-artifact@v6
        with:
          name: r8-mapping
          path: androidApp/build/outputs/mapping/release/
          retention-days: 7

  # Tests unitarios de iOS (XCTest). Necesita macOS: compila el framework de Kotlin con Gradle
  # (script de build de Xcode) y ejecuta iosAppTests en un simulador. Los tests de UI no se
  # ejecutan aquí.
  ios-tests:
    name: iOS unit tests
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle (with cache)
        uses: gradle/actions/setup-gradle@v6

      - name: Show Xcode, schemes and simulators
        working-directory: iosApp
        run: |
          xcodebuild -version
          xcodebuild -list -project iosApp.xcodeproj
          xcrun simctl list devices available

      # El nombre del simulador depende de la versión de Xcode del runner: se elige el primer
      # iPhone disponible en lugar de fijar uno.
      - name: Pick an iPhone simulator
        run: |
          UDID=$(xcrun simctl list devices available iPhone | grep -Eo '[0-9A-F]{8}-([0-9A-F]{4}-){3}[0-9A-F]{12}' | head -n 1)
          test -n "$UDID" || { echo "No iPhone simulator available"; exit 1; }
          echo "SIMULATOR_UDID=$UDID" >> "$GITHUB_ENV"
          echo "Using simulator $UDID"

      - name: Run iOS unit tests
        working-directory: iosApp
        run: |
          set -o pipefail
          xcodebuild test \
            -project iosApp.xcodeproj \
            -scheme iosApp \
            -destination "id=$SIMULATOR_UDID" \
            -only-testing:iosAppTests \
            -resultBundlePath "$RUNNER_TEMP/ios-tests.xcresult" \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: ios-test-results
          path: ${{ runner.temp }}/ios-tests.xcresult
          retention-days: 7

  # AAB de release firmado, solo en push a main (los PR, sobre todo de forks, no reciben
  # secretos). Usa un keystore de demostración guardado en secretos del repositorio; no es una
  # clave de publicación en Google Play.
  android-release-signed:
    name: Signed release bundle
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Accept Android SDK licenses
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Set up Gradle (with cache)
        uses: gradle/actions/setup-gradle@v6

      - name: Restore keystore from secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "Missing secret RELEASE_KEYSTORE_BASE64"; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "RELEASE_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Bundle release
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew :androidApp:bundleRelease --stacktrace

      # Comprueba que el AAB está firmado con nuestro certificado y no sin firmar.
      - name: Verify signature
        run: |
          AAB=androidApp/build/outputs/bundle/release/androidApp-release.aab
          test -f "$AAB" || { echo "AAB not found: $AAB"; exit 1; }
          jarsigner -verify "$AAB" | tee "$RUNNER_TEMP/verify.txt"
          grep -q "jar verified" "$RUNNER_TEMP/verify.txt"
          echo "Signed AAB: $(du -h "$AAB" | cut -f1)" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload AAB
        uses: actions/upload-artifact@v6
        with:
          name: release-aab
          path: androidApp/build/outputs/bundle/release/*.aab
          retention-days: 14