# Path: .github/workflows/ci.yml
name: CI

on:
  push:
    branches: [main]
  pull_request:

# Una ejecución nueva sobre la misma rama cancela la anterior.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android:
    name: Android and shared logic
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      # El runner ya trae el SDK. Esta acción solo se usa para aceptar las licencias, para que
      # AGP pueda descargar la plataforma que falte. `packages: ''` evita instalar el paquete
      # obsoleto "tools", que es el que hacía fallar este paso.
      - name: Accept Android SDK licenses
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Set up Gradle (with cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Shared logic tests
        run: ./gradlew :sharedLogic:allTests --stacktrace

      - name: Android unit tests
        run: ./gradlew :androidApp:testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: ./gradlew :androidApp:assembleDebug --stacktrace

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            **/build/reports/tests/
            **/build/test-results/
          if-no-files-found: ignore